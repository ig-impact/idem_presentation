on:
  push:
    branches: [main]
  workflow_dispatch:

name: Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.2"
          use-public-rspm: true

      - name: Install system dependencies
        run: sudo apt-get install -y libnode-dev

      - uses: r-lib/actions/setup-renv@v2

      - name: Render slides
        run: quarto render

      - name: Copy presenter slides into output dir
        run: cp index-speaker.html _site/index-speaker.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
